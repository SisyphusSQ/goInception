name: release

on:
  push:
    tags:
      - "**"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: package
        run: |
          make release
          (cd release && sha256sum *.tar.gz > SHA256SUMS)

      - name: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" ./release/*.tar.gz ./release/SHA256SUMS \
            --title "${{ github.ref_name }}" \
            --notes-from-tag \
            --verify-tag
